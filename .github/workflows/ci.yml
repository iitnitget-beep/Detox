name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not committed (public repo). CI compiles against a placeholder,
      # or against the GOOGLE_SERVICES_JSON repository secret when you add one.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp ci/google-services.ci.json app/google-services.json
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee debug.log

      - name: Assemble release APK (R8)
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee release.log

      - name: Test totals
        if: success()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"::notice title=Android unit tests::{t} tests, {f} failures, {e} errors, {s} skipped")
          PY

      - name: Explain failure
        if: failure()
        run: |
          for f in test.log debug.log release.log; do
            [ -f "$f" ] && ci/annotate-log.sh "$f" error '^e: |^w: .*(deprecated|unused)|error:|FAILED|What went wrong|Exception|> Task .*FAILED|ERROR:|Missing class' "$f"
          done
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or "").replace("\n", " ")[:300]
                      print(f"::error title=Failed test::{case.get('classname')}.{case.get('name')}: {msg}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ci-placeholder-config
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  functions:
    name: Cloud Functions build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../functions-lint.log
      - run: npm run build
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../functions-test.log
      - name: Test totals
        if: success()
        working-directory: .
        run: ci/annotate-log.sh functions-test.log notice '^# (tests|pass|fail) ' "Functions tests"
      - name: Explain failure
        if: failure()
        working-directory: .
        run: |
          [ -f functions-lint.log ] && ci/annotate-log.sh functions-lint.log error 'error TS' "tsc"
          [ -f functions-test.log ] && ci/annotate-log.sh functions-test.log error '^not ok|AssertionError|Error:|expected|actual' "Functions tests"
          true

  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}
      - run: npm ci --no-audit --no-fund
        working-directory: firestore-tests
      - run: npx tsc -p tsconfig.json
        working-directory: firestore-tests
      - name: Rules tests against the emulator
        working-directory: firestore-tests
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee ../rules-test.log
      - name: Test totals
        if: success()
        run: ci/annotate-log.sh rules-test.log notice '^# (tests|pass|fail) ' "Rules tests"
      - name: Explain failure
        if: failure()
        run: ci/annotate-log.sh rules-test.log error '^not ok|AssertionError|Error:|FirebaseError|PERMISSION_DENIED|expected' "Rules tests"
